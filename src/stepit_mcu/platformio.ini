; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Flash with the command line loader instead of the graphical Teensy Loader.
; The default, teensy-gui, opens a window and reports success for having
; launched it rather than for having flashed the board, which makes an upload
; from a script or over a remote session unverifiable. The command line loader
; needs the Teensy udev rules installed (/etc/udev/rules.d/00-teensy.rules).
upload_protocol = teensy-cli
